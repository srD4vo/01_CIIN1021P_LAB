<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador OLAP y KPI Tema 06</title>
<style>
/* =====================================================================
   COLORES Y TEXTOS BASE (el docente puede cambiar estos valores)
   Diseño de un solo tema claro, pensado para proyectar.
   Acento UPN: #FDBA30 (siempre con texto negro encima).
   ===================================================================== */
:root{
  color-scheme:light;
  --upn:#FDBA30; --upn-soft:#FFF4D6; --upn-line:#E7A300;
  --bg:#F3F3F0; --surface:#FFFFFF; --surface-2:#F8F8F5; --ink:#141414; --ink-2:#3B3B38;
  --muted:#5F5F5A; --line:#DCDBD4; --line-strong:#ADABA2;
  --concept:#6A1FB8; --concept-bg:#F4EEFC;
  --info:#0A5F99; --info-bg:#E7F3FB;
  --ok:#0B7A41; --ok-bg:#E2F3E9; --bad:#B8143A; --bad-bg:#FCE7EB; --warn-bg:#FFF4D6;
  --code-bg:#1E1E1E; --code-ink:#D4D4D4; --code-kw:#569CD6; --code-fn:#DCDCAA; --code-str:#CE9178;
  --code-num:#B5CEA8; --code-cm:#6A9955; --code-par:#9CDCFE;
  /* Series validadas para daltonismo (fondo claro) */
  --s-norte:#0090D6; --s-centro:#C98A00; --s-sur:#9500FF;
  --p0:#0090D6; --p1:#C98A00;
  --f:Arial,"Helvetica Neue",Helvetica,"Liberation Sans",sans-serif;
  --f-code:Consolas,"Cascadia Mono","SF Mono",Menlo,"Liberation Mono",monospace;
  --fs:16px;
}
:root.proj{--fs:20px}
*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 var(--f);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
h1,h2,h3,h4{line-height:1.2;margin:0;text-wrap:balance}
p{margin:0 0 .7em;max-width:72ch}
code{font-family:var(--f-code);font-size:.9em;background:#EEEDE7;padding:.05em .35em;border-radius:3px}
small{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- Cabecera ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:#141414;color:#fff;border-bottom:5px solid var(--upn)}
.hdr-in{display:flex;align-items:center;gap:16px;padding:9px 20px;max-width:1500px;margin:0 auto}
.brand{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand b{font-size:1.02rem}
.brand b span{color:var(--upn)}
.brand small{color:#BDBDB6;font-size:.76rem}
.where{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.where-t{font-size:.84rem;color:#C9C9C2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where-t b{color:#fff}
.bar{height:7px;background:#333;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--upn);transition:width .35s ease}
.pct{font-weight:700;font-size:.9rem;min-width:3.4em;text-align:right}
.hbtn{border:1.5px solid #666;background:transparent;color:#fff;border-radius:6px;padding:5px 10px;font-size:.8rem;cursor:pointer;white-space:nowrap}
.hbtn[aria-pressed="true"]{background:var(--upn);border-color:var(--upn);color:#000;font-weight:700}
.menu-btn{display:none}

/* ---------- Estructura ---------- */
.shell{display:grid;grid-template-columns:280px minmax(0,1fr);gap:26px;max-width:1500px;margin:0 auto;padding-block:20px 80px;padding-inline:20px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);align-self:start;max-height:calc(100vh - 96px);overflow:auto;padding-right:4px}
.sess{font-size:.74rem;font-weight:700;color:var(--muted);margin:14px 10px 4px;letter-spacing:.04em}
.sess:first-child{margin-top:0}
.mod-btn{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer}
.mod-btn:hover{background:var(--surface)}
.mod-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.78rem;border:2px solid var(--ink)}
.mod.cur .mod-n{background:var(--upn);border-color:var(--upn-line);color:#000}
.mod.full .mod-n{background:var(--ink);color:#fff}
.mod-t{font-weight:700;font-size:.93rem;line-height:1.2}
.mod-t small{display:block;font-weight:400;font-size:.75rem}
.mod-p{font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.steps{list-style:none;margin:2px 0 8px 24px;padding:0 0 0 14px;border-left:2px solid var(--line)}
.steps button{width:100%;text-align:left;border:0;background:none;padding:5px 8px;border-radius:5px;font-size:.85rem;color:var(--ink-2);cursor:pointer;display:flex;gap:8px;align-items:baseline}
.steps button:hover{background:var(--surface)}
.steps button[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--upn-line)}
.dot{flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line-strong);transform:translateY(1px)}
.dot.half{background:var(--upn);border-color:var(--upn-line)}
.dot.done{background:var(--ok);border-color:var(--ok)}
.rail-foot{font-size:.78rem;color:var(--muted);padding:10px;border-top:1px solid var(--line);margin-top:10px}
.linkbtn{border:0;background:none;padding:0;color:var(--bad);text-decoration:underline;cursor:pointer;font-size:inherit}

main{min-width:0}
.screen{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:28px 34px 32px}
.kicker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.82rem;color:var(--muted);margin-bottom:6px}
.pill{font-weight:700;border-radius:3px;padding:1px 8px;font-size:.74rem}
.pill.dark{background:var(--ink);color:#fff}
.pill.time{background:var(--upn);color:#000}
.pill.doc{background:var(--concept);color:#fff}
.screen h1{font-size:clamp(1.5rem,2.5vw,2.1rem);margin-bottom:6px;max-width:34ch}
.lead{font-size:1.05rem;color:var(--ink-2);margin-bottom:6px}
.stack{display:flex;flex-direction:column;gap:22px;margin-top:20px}

/* ---------- Secuencia didáctica ---------- */
.blk{position:relative;border:1px solid var(--line);border-radius:6px;padding:16px 20px 18px;background:var(--surface)}
.blk>header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.blk>header .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.76rem;font-weight:700;flex:none;background:var(--ink);color:#fff}
.blk>header .lab{font-size:.76rem;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.blk>header h3{font-size:1.08rem;margin:0}
.blk.sit{background:var(--surface-2)}
.blk.con{background:var(--concept-bg);border-color:transparent}
.blk.con>header .n{background:var(--concept)}
.blk.pred{border:2px solid var(--upn-line);background:var(--upn-soft)}
.blk.pred>header .n{background:var(--upn);color:#000}
.blk.int{border:2px solid var(--ink)}
.blk.res{background:var(--ok-bg);border-color:transparent}
.blk.res>header .n{background:var(--ok)}
.blk.expl{background:var(--surface-2)}
.blk.colab{background:#F1F1EC}
.blk.colab>header .n{background:#3B3B38}
.blk.doc{border:2px dashed var(--concept);background:var(--concept-bg)}
.blk.doc>header .n{background:var(--concept)}
.blk.solved{border-color:var(--ok)!important}
.blk ul,.blk ol{margin:.2em 0 .8em;padding-left:1.3em;max-width:72ch}
.blk li{margin:.25em 0}
details.more{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
details.more summary{cursor:pointer;font-weight:700;color:var(--info);font-size:.92rem}
details.more[open] summary{margin-bottom:8px}
.key{margin-top:10px;padding:10px 14px;background:var(--surface);border-left:4px solid var(--upn-line);border-radius:0 5px 5px 0;max-width:76ch}
.sim-tag{display:inline-block;font-size:.72rem;font-weight:700;border:1.5px solid var(--ink);border-radius:3px;padding:0 6px;margin-bottom:8px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}

/* ---------- Código ---------- */
.cw{margin:8px 0;border-radius:6px;overflow:hidden;background:var(--code-bg)}
.cbar{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:#2D2D2D;color:#CFCFCF;font-size:.78rem}
.code{color:var(--code-ink);font:14px/1.6 var(--f-code);padding:12px 16px;margin:0;overflow-x:auto;white-space:pre;tab-size:4}
:root.proj .code{font-size:17px}
.code .kw{color:var(--code-kw)} .code .fn{color:var(--code-fn)} .code .st{color:var(--code-str)}
.code .nm{color:var(--code-num)} .code .cm{color:var(--code-cm)} .code .pa{color:var(--code-par)}
.code input.blank{font:inherit;background:#333337;color:#FFE08A;border:0;border-bottom:2px solid var(--upn);padding:0 4px;min-width:4ch;border-radius:2px}
.code input.blank.ok{border-bottom-color:#4EC98A;color:#A8F0C8}
.code input.blank.bad{border-bottom-color:#FF6B86;color:#FFB3C1}
.mini{border:1px solid var(--line-strong);background:var(--surface);border-radius:4px;padding:2px 9px;cursor:pointer;font-size:.8rem}
.cbar .mini{background:#3C3C3C;border-color:#5A5A5A;color:#fff}
.mini:disabled{opacity:.4;cursor:default}

/* ---------- Tablas ---------- */
.tw{overflow-x:auto;margin:6px 0}
table.rs{border-collapse:collapse;font-size:.9rem;min-width:100%}
table.rs th,table.rs td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.rs th{font-size:.78rem;color:var(--muted);border-bottom:2px solid var(--ink)}
table.rs .n{text-align:right;font-variant-numeric:tabular-nums}
table.rs tr.tot td{font-weight:700;background:var(--upn-soft)}
table.rs tr.hl td{background:var(--bad-bg)}
.null{font-family:var(--f-code);font-size:.8em;background:#ECEBE5;color:var(--muted);padding:1px 6px;border-radius:3px}

/* ---------- Actividades ---------- */
.q{font-weight:700;margin-bottom:10px;max-width:76ch}
.opts{display:grid;gap:8px;max-width:780px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:8px 12px;cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt .mk{flex:none;width:18px;height:18px;border:2px solid var(--line-strong);border-radius:50%;margin-top:2px}
.opt.multi .mk{border-radius:4px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--upn-soft)}
.opt[aria-pressed="true"] .mk{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--surface)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)} .opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok::after{content:"✓ correcta";margin-left:auto;font-size:.76rem;font-weight:700;color:var(--ok)}
.opt.bad::after{content:"✕ revisa";margin-left:auto;font-size:.76rem;font-weight:700;color:var(--bad)}
.grid-m{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:8px 14px;align-items:center;max-width:980px}
.grid-m .it{padding:7px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;font-size:.93rem}
select,input.f,textarea{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:7px 10px;width:100%;min-width:0}
select.ok,input.f.ok,textarea.ok{border-color:var(--ok);background:var(--ok-bg)}
select.bad,input.f.bad,textarea.bad{border-color:var(--bad);background:var(--bad-bg)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px;max-width:880px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:.86rem;color:var(--ink-2)}
.fields.wide{grid-template-columns:1fr}
textarea{min-height:80px;resize:vertical}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{border:1.5px solid var(--ink);background:var(--surface);border-radius:6px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:.9rem}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--upn);border-color:var(--upn-line);color:#000}
.btn.ghost{border-color:var(--line-strong)}
.btn.docb{border-color:var(--concept);color:var(--concept)}
.btn:disabled{opacity:.45;cursor:default}
.fb{margin-top:12px;padding:10px 14px;border-radius:6px;max-width:80ch;font-size:.95rem}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb ul{margin:.3em 0 0;padding-left:1.2em;color:var(--ink)}
.fb .ttl{font-weight:700}
.hint{margin-top:10px;padding:10px 14px;border-radius:6px;background:var(--surface);border:1px solid var(--line);max-width:80ch}
.hint .h,.exp .h,.sol .h{display:block;font-size:.74rem;font-weight:700;margin-bottom:3px}
.hint .h{color:var(--info)}
.exp{margin-top:10px;padding:12px 14px;border-radius:6px;background:var(--info-bg);max-width:80ch}
.sol{margin-top:10px;padding:12px 14px;border-radius:6px;border:2px dashed var(--concept);background:var(--concept-bg);max-width:84ch}
.sol .h{color:var(--concept)}

/* ---------- Diagramas y simulaciones ---------- */
figure{margin:6px 0}
figure svg{display:block;width:100%;height:auto;max-width:100%}
figcaption{font-size:.84rem;color:var(--muted);margin-top:6px;max-width:76ch}
.fig-wrap{overflow-x:auto}
.svgt{font-family:var(--f);fill:currentColor}
.stage{border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tab{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:4px 14px;cursor:pointer;font-weight:700;font-size:.86rem}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tab:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line-strong);border-radius:99px;padding:3px 11px;font-size:.85rem;background:var(--surface);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.out{font-family:var(--f-code);font-size:.88rem;background:#141414;color:#E9E9E3;border-radius:6px;padding:10px 14px;white-space:pre-wrap;min-height:2.6em}
.out b{color:var(--upn)}

/* Piezas del entorno */
.envmap{display:grid;gap:10px}
.envbox{border:2px solid var(--ink);border-radius:8px;padding:10px 12px;background:var(--surface)}
.envbox>.t{font-weight:700;font-size:.82rem;color:var(--muted);margin-bottom:6px}
.envrow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.piece{border:1.5px solid var(--line-strong);border-radius:6px;background:var(--surface-2);padding:7px 12px;cursor:pointer;font-weight:700;font-size:.9rem;text-align:left}
.piece[aria-pressed="true"]{background:var(--upn);border-color:var(--upn-line);color:#000}
.piece small{display:block;font-weight:400;color:var(--muted);font-size:.74rem}
.piece[aria-pressed="true"] small{color:#3a2a00}
.arrow-r{align-self:center;font-weight:700;color:var(--muted)}

/* Viajes y grupos (E01) */
.cards{display:flex;flex-wrap:wrap;gap:8px}
.tcard{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:6px 10px;font-size:.86rem;min-width:118px;transition:transform .3s ease,opacity .3s ease}
.tcard b{display:block;font-size:.95rem}
.tcard.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--upn)}
.tcard.dim{opacity:.35}
.buckets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.bucket{border:2px dashed var(--line-strong);border-radius:8px;padding:10px;min-height:150px;background:var(--surface)}
.bucket h4{font-size:.95rem;margin-bottom:6px}
.bucket .agg{font-family:var(--f-code);font-size:.85rem;margin-top:8px;padding-top:6px;border-top:1px solid var(--line)}
.colbtn{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--info);text-decoration:underline dotted;cursor:pointer}

/* RDD (E02) */
.parts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.part{border:2px solid var(--p0);border-radius:8px;padding:10px;background:var(--surface)}
.part.p1{border-color:var(--p1)}
.part h4{font-size:.86rem;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.tup{display:inline-flex;gap:0;border:1.5px solid var(--line-strong);border-radius:6px;overflow:hidden;margin:3px;background:var(--surface);cursor:pointer;font-family:var(--f-code);font-size:.86rem;padding:0}
.tup span{padding:4px 8px}
.tup span+span{border-left:1px solid var(--line)}
.tup.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--upn)}
.tup.pass{background:var(--ok-bg);border-color:var(--ok)}
.tup.drop{opacity:.3}
.plan{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:44px;padding:8px;border:2px dashed var(--line-strong);border-radius:8px;background:var(--surface)}
.node{border:1.5px dashed var(--ink);border-radius:6px;padding:4px 10px;font-family:var(--f-code);font-size:.84rem;background:var(--surface-2)}
.node.run{border-style:solid;background:var(--ok-bg);border-color:var(--ok)}
.shuffle{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:10px}
.lanes{display:grid;gap:6px}
.lane{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface);font-family:var(--f-code);font-size:.84rem}

/* Calidad (E03) */
.rec{border:1.5px solid var(--line-strong);border-radius:6px;padding:8px 10px;background:var(--surface);font-family:var(--f-code);font-size:.84rem}
.reccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.reccard{border:1.5px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.reccard .rec{border:0;padding:0}
.reccard.ok{border-color:var(--ok)} .reccard.bad{border-color:var(--bad)}

/* Gráficos y reporte */
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--ink-2);margin-top:4px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.report{display:grid;grid-template-columns:1.6fr 1fr;gap:12px}
.tile{border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--surface)}
.tile h5{margin:0 0 6px;font-size:.95rem}
.tile.wide{grid-column:1/-1}
.kpi{font-size:2.3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi-sub{font-size:.8rem;color:var(--muted)}
.funnel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:stretch}
.fstep{border-radius:8px;padding:10px;text-align:center;border:1.5px solid var(--line-strong);background:var(--surface)}
.fstep strong{display:block;font-size:1.7rem;font-variant-numeric:tabular-nums}
.fstep span{font-size:.8rem;color:var(--muted)}
.fstep.y{background:var(--upn-soft);border-color:var(--upn-line)}
.fstep.g{background:var(--ok-bg);border-color:var(--ok)}
.fstep.r{background:var(--bad-bg);border-color:var(--bad)}
.timer{font-family:var(--f-code);font-size:1.6rem;font-weight:700}
.checkl{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.checkl label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checkl input{margin-top:4px}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.medal{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;max-width:760px}
.medal div{border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--surface-2)}
.medal b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums}
.medal span{font-size:.8rem;color:var(--muted)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#141414;color:#fff;padding:8px 16px;border-radius:6px;font-size:.88rem;z-index:50}

@media (max-width: 1000px){
  .shell{grid-template-columns:1fr;gap:14px;padding-inline:14px}
  .rail{position:static;max-height:none;display:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}
  .rail.open{display:block}
  .menu-btn{display:inline-block}
  .screen{padding:22px 18px 24px}
  .report{grid-template-columns:1fr}
  .grid-m{grid-template-columns:1fr}

}
@media (max-width: 640px){
  .hdr-in{flex-wrap:wrap;gap:8px 10px;padding:8px 14px}
  .where{order:3;flex-basis:100%}
  .brand small{display:none}
  .buckets,.parts{grid-template-columns:1fr}
  .shuffle{grid-template-columns:1fr}
  .hbtn.hide-sm{display:none}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
.credito{max-width:1500px;margin:0 auto;padding-block:0 28px;padding-inline:20px;font-size:.8rem;color:var(--muted);text-align:center}
.rail-credito{display:block;margin-top:8px;font-size:.76rem;color:var(--muted)}
/* ===== Tema 01: componentes nuevos ===== */
.ver-tag{display:inline-block;font-size:.68rem;font-weight:700;border-radius:3px;padding:0 6px;margin-left:8px;vertical-align:2px;background:var(--upn);color:#000}
.ver-tag.doc{background:var(--concept);color:#fff}
.lbl{font-size:.8rem;color:var(--muted);font-weight:700;display:block;margin-bottom:3px}
.ctlrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px;margin-bottom:12px}
.ctlrow label{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--ink-2);font-weight:700}
.cascade{display:grid;gap:6px;margin:8px 0}
.casc{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:6px;padding:7px 10px;background:var(--surface);font-size:.9rem}
.casc code{background:transparent;padding:0}
.casc .st{font-size:.76rem;font-weight:700;border-radius:3px;padding:1px 8px;white-space:nowrap}
.casc.pass{border-color:var(--line)}
.casc.pass .st{background:var(--ok-bg);color:var(--ok)}
.casc.hit{border-color:var(--bad);background:var(--bad-bg)}
.casc.hit .st{background:var(--bad);color:#fff}
.casc.skip{opacity:.45}
.casc.skip .st{background:#ECEBE5;color:var(--muted)}
.casc.good{border-color:var(--ok);background:var(--ok-bg)}
.casc.good .st{background:var(--ok);color:#fff}
.casc .no{width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:.72rem;font-weight:700}
.rtable{margin-top:8px}
.badge{display:inline-block;font-weight:700;font-size:.78rem;border-radius:3px;padding:1px 8px}
.badge.v{background:var(--ok-bg);color:var(--ok)} .badge.o{background:var(--warn-bg);color:#7A5200} .badge.i{background:var(--bad-bg);color:var(--bad)} .badge.n{background:#ECEBE5;color:var(--muted)}
.rulelist{display:grid;gap:6px;margin:8px 0}
.rule{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--surface);font-size:.88rem}
.rule.done{border-color:var(--ok);background:var(--ok-bg)}
.rule.next{border:2px solid var(--upn-line);background:var(--upn-soft)}
.rule .no{width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:.72rem;font-weight:700}
.rowhit td{background:var(--upn-soft)}
.rowlost td{background:var(--bad-bg)}
.gitflow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:stretch}
.gstage{border:2px solid var(--line-strong);border-radius:8px;padding:10px;background:var(--surface);text-align:center}
.gstage b{display:block;font-size:.92rem}
.gstage small{display:block;margin-top:4px}
.gstage.on{border-color:var(--ok);background:var(--ok-bg)}
.gstage.cur{box-shadow:0 0 0 3px var(--upn)}
.er{background:var(--bad-bg);color:var(--bad);padding:8px 12px;border-radius:6px;font-weight:700;margin-top:8px}
.er.good{background:var(--ok-bg);color:var(--ok)}
.er.warn{background:var(--warn-bg);color:#7A5200}
.tri-t{color:var(--ok);font-weight:700}.tri-f{color:var(--bad);font-weight:700}.tri-u{color:#7A5200;font-weight:700}
.dtab{width:100%}
@media (max-width:640px){.gitflow{grid-template-columns:1fr 1fr}}
.brand b span.ver-tag{color:#000}
.brand b span.ver-tag.doc{color:#fff}
/* Tema 02: cascadas legibles en pantallas angostas */
.casc{grid-template-columns:auto minmax(0,1fr) auto}
.casc code{white-space:normal;overflow-wrap:anywhere}
@media (max-width:560px){.casc{grid-template-columns:auto minmax(0,1fr)}.casc .st{grid-column:2;white-space:normal;justify-self:start}}
/* Tema 02: las tablas de texto se ajustan en vez de desplazarse */
table.rs th,table.rs td{white-space:normal}
table.rs td code{white-space:nowrap}
/* ---- Tema 04: consola mongosh simulada ---- */
.mgc{margin-bottom:8px}
.mg-ta{width:100%;box-sizing:border-box;font:14px/1.5 var(--f-code);border:1.5px solid var(--line-strong);border-radius:6px;padding:10px 12px;background:#FBFBF8;color:var(--ink);resize:vertical;tab-size:2}
.mg-ta:focus{outline:3px solid var(--upn);outline-offset:1px}
.mg-log{background:var(--surface);color:var(--ink);border:1px solid var(--line);max-height:480px;overflow:auto}
.mg-in{font-family:var(--f-code);font-size:.84rem;white-space:pre-wrap;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:6px;margin-top:6px}
.mg-in:first-child{border-top:0;margin-top:0;padding-top:0}
.mg-in::before{content:"› ";color:var(--muted);font-weight:700}
.mg-out{margin:4px 0 0;font:13px/1.45 var(--f-code);white-space:pre-wrap;color:var(--ink);background:transparent;padding:0}
.mini-h{font-size:.88rem;margin:14px 0 6px}
.kv{display:flex;flex-wrap:wrap;gap:6px}
.kv .pill{border:1px solid var(--line-strong);background:var(--surface)}
:root.proj .mg-ta{font-size:17px}
.out,.mg-out,.mg-in{overflow-wrap:anywhere}
.grid-m .it{overflow-wrap:anywhere}
/* Tema 06: tarjetas KPI del dashboard simulado */
.kcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:4px 0 10px}
.kc{border:1px solid var(--line);border-left:4px solid var(--brand,#F5B400);border-radius:6px;padding:8px 10px;background:var(--card,#fff)}
.kc small{display:block;color:var(--muted);font-size:.74rem;line-height:1.2}
.kc b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums;margin-top:2px}
.kc.bad{border-left-color:var(--bad)} .kc.good{border-left-color:var(--ok)}
table.rs.num td{font-variant-numeric:tabular-nums;white-space:nowrap}

/* ===== Codigo de la guia del Tema 06 (estudiante) ===== */
const SRC = {"e1_ver": "USE BDDataSaludTema06;\nGO\n-- Paso 0. Punto de partida: debe coincidir con la verificacion del script 00.\nSELECT COUNT(*) AS Atenciones, SUM(DuracionMinutos) AS Minutos,\n       CAST(SUM(DuracionMinutos) * 1.0 / COUNT(*) AS DECIMAL(6,2)) AS TiempoPromedio\nFROM dw.FactAtencion;", "e1_prov": "-- Paso 1. Un nivel: atenciones, minutos y tiempo promedio por provincia.\n-- El promedio se calcula al final (SUM / COUNT), nunca promediando promedios.\nSELECT e.Provincia,\n       COUNT(*)                 AS Atenciones,\n       SUM(h.DuracionMinutos)   AS Minutos,\n       CAST(SUM(h.DuracionMinutos) * 1.0 / COUNT(*) AS DECIMAL(6,2)) AS TiempoPromedio\nFROM dw.FactAtencion AS h\nINNER JOIN dw.DimEstablecimiento AS e ON e.EstablecimientoKey = h.EstablecimientoKey\nGROUP BY e.Provincia\nORDER BY e.Provincia;", "e1_rollup": "-- TODO E01-1. Jerarquia provincia -> establecimiento con subtotales (ROLLUP).\n-- GROUPING(col) = 1 cuando la fila es un subtotal de esa columna, no un dato ausente.\nSELECT CASE WHEN GROUPING(e.Provincia) = 1 THEN 'TOTAL REGIONAL'\n            ELSE e.Provincia END                                   AS Provincia,\n       CASE WHEN ________ = 1\n                 AND GROUPING(e.Provincia) = 0 THEN 'SUBTOTAL PROVINCIA'\n            WHEN GROUPING(e.CodigoEstablecimiento) = 1 THEN ''\n            ELSE e.CodigoEstablecimiento END                        AS Establecimiento,\n       COUNT(*)               AS Atenciones,\n       SUM(h.DuracionMinutos) AS Minutos\nFROM dw.FactAtencion AS h\nINNER JOIN dw.DimEstablecimiento AS e ON e.EstablecimientoKey = h.EstablecimientoKey\nGROUP BY ________ (e.Provincia, e.CodigoEstablecimiento)\nORDER BY GROUPING(e.Provincia), e.Provincia, GROUPING(e.CodigoEstablecimiento), e.CodigoEstablecimiento;", "e1_slice": "-- Paso 3. Slice: fijar UNA dimension (provincia = TRUJILLO) y bajar al establecimiento (drill-down).\nSELECT e.CodigoEstablecimiento, e.Distrito, COUNT(*) AS Atenciones\nFROM dw.FactAtencion AS h\nINNER JOIN dw.DimEstablecimiento AS e ON e.EstablecimientoKey = h.EstablecimientoKey\nWHERE e.Provincia = 'TRUJILLO'\nGROUP BY e.CodigoEstablecimiento, e.Distrito\nORDER BY e.CodigoEstablecimiento;\n\n-- Dice: restringir VARIAS dimensiones a la vez (subcubo).\nSELECT COUNT(*) AS Atenciones, SUM(h.DuracionMinutos) AS Minutos\nFROM dw.FactAtencion AS h\nINNER JOIN dw.DimEstablecimiento AS e ON e.EstablecimientoKey = h.EstablecimientoKey\nINNER JOIN dw.DimFecha          AS f ON f.FechaKey = h.FechaKey\nINNER JOIN dw.DimTipoAtencion   AS t ON t.TipoAtencionKey = h.TipoAtencionKey\nWHERE e.Provincia IN ('TRUJILLO', 'CHEPEN')\n  AND f.Semestre = 2\n  AND t.TipoAtencion = 'CONSULTA';", "e1_cube": "-- Paso 4. CUBE: todas las combinaciones de tipo y semestre, mas sus totales.\nSELECT CASE WHEN GROUPING(t.TipoAtencion) = 1 THEN '(todos)' ELSE t.TipoAtencion END AS Tipo,\n       CASE WHEN GROUPING(f.Semestre) = 1 THEN '(todos)' ELSE CAST(f.Semestre AS VARCHAR(7)) END AS Semestre,\n       COUNT(*) AS Atenciones\nFROM dw.FactAtencion AS h\nINNER JOIN dw.DimTipoAtencion AS t ON t.TipoAtencionKey = h.TipoAtencionKey\nINNER JOIN dw.DimFecha        AS f ON f.FechaKey = h.FechaKey\nGROUP BY CUBE (t.TipoAtencion, f.Semestre)\nORDER BY GROUPING(t.TipoAtencion), t.TipoAtencion, GROUPING(f.Semestre), f.Semestre;", "e1_gsets": "-- TODO E01-2. Con GROUPING SETS, obtener SOLO: total por tipo, total por semestre y total general\n-- (sin las combinaciones tipo x semestre). Mismo SELECT del Paso 4; cambia el GROUP BY.\n-- (escribir aqui el codigo)", "e1_part": "-- TODO E01-3. Participacion de cada provincia en el total regional de atenciones.\n-- SUM(COUNT(*)) OVER () suma los conteos de TODOS los grupos: es el denominador.\nSELECT e.Provincia,\n       COUNT(*) AS Atenciones,\n       CAST(100.0 * COUNT(*) / ________ AS DECIMAL(5,2)) AS Participacion\nFROM dw.FactAtencion AS h\nINNER JOIN dw.DimEstablecimiento AS e ON e.EstablecimientoKey = h.EstablecimientoKey\nGROUP BY e.Provincia\nORDER BY ________, e.Provincia;", "e2_ctrl": "USE BDDataSaludTema06;\nGO\n-- Controles para comparar con el cubo (deben coincidir con la tabla dinamica).\nSELECT f.Anio, f.Semestre, COUNT(*) AS Atenciones, SUM(h.DuracionMinutos) AS Minutos\nFROM dw.FactAtencion AS h\nINNER JOIN dw.DimFecha AS f ON f.FechaKey = h.FechaKey\nGROUP BY ROLLUP (f.Anio, f.Semestre)\nORDER BY GROUPING(f.Anio), f.Anio, GROUPING(f.Semestre), f.Semestre;", "e2_mdx": "// TODO E02-3. Miembro calculado del cubo (pestana Calculos). Nombre: [Tiempo Promedio]\n// Expresion MDX:\nIIF([Measures].[Atenciones] = 0, NULL,\n    [Measures].[________] / [Measures].[________])", "e2_param": "-- Conjunto de datos dsEstablecimientos (valores disponibles del parametro).\nSELECT CodigoEstablecimiento, CodigoEstablecimiento + ' - ' + Nombre AS Etiqueta\nFROM dw.DimEstablecimiento\nORDER BY CodigoEstablecimiento;", "e2_rep": "-- TODO E02-4. Conjunto de datos dsAtencionesEstablecimiento.\n-- Una fila = un mes y un tipo de atencion del establecimiento elegido (datos agregados).\nSELECT f.Mes, f.NombreMes, t.TipoAtencion,\n       COUNT(*)               AS Atenciones,\n       SUM(h.DuracionMinutos) AS Minutos\nFROM dw.FactAtencion AS h\nINNER JOIN dw.DimFecha           AS f ON f.FechaKey = h.FechaKey\nINNER JOIN dw.DimTipoAtencion    AS t ON t.TipoAtencionKey = h.TipoAtencionKey\nINNER JOIN dw.DimEstablecimiento AS e ON e.EstablecimientoKey = h.EstablecimientoKey\nWHERE e.CodigoEstablecimiento = ________\nGROUP BY ________\nORDER BY f.Mes, t.TipoAtencion;", "e3_dax_base": "// Medidas base (tabla FactAtencion). Cada medida es una formula explicita y reutilizable.\nAtenciones = COUNTROWS ( FactAtencion )\nMinutos = SUM ( FactAtencion[DuracionMinutos] )\nAtenciones por establecimiento = DIVIDE ( [Atenciones], COUNTROWS ( DimEstablecimiento ) )", "e3_dax_todo": "// TODO E03-1. Tiempo promedio: minutos entre atenciones, sin error si no hay atenciones.\nTiempo promedio = ________ ( [Minutos], [Atenciones] )\n\n// TODO E03-2. Participacion de las atenciones del contexto en el total de establecimientos.\nParticipacion atenciones =\nDIVIDE ( [Atenciones], CALCULATE ( [Atenciones], ________ ) )", "e3_dax_cob": "// Cobertura de primera dosis (tabla FactVacunacion y dw.MetaCobertura).\nPrimeras dosis = CALCULATE ( COUNTROWS ( FactVacunacion ), FactVacunacion[NumeroDosis] = 1 )\n\n// MetaCobertura no tiene relacion: TREATAS aplica las provincias visibles como filtro.\nPoblacion objetivo =\nCALCULATE (\n    SUM ( MetaCobertura[PoblacionObjetivo] ),\n    TREATAS ( VALUES ( DimEstablecimiento[Provincia] ), MetaCobertura[Provincia] )\n)\n\n// TODO E03-3. Cobertura = primeras dosis / poblacion objetivo.\nCobertura primera dosis = // (escribir aqui la medida)\nMeta cobertura = DIVIDE ( MAX ( MetaCobertura[MetaPorcentaje] ), 100 )\nEstado cobertura = IF ( [Cobertura primera dosis] < [Meta cobertura], \"Bajo meta\", \"Cumple\" )", "e3_ctrl": "USE BDDataSaludTema06;\nGO\n-- Control en SQL de la cobertura que debe mostrar Power BI.\nWITH Dosis AS (\n    SELECT e.Provincia, COUNT(*) AS PrimerasDosis\n    FROM dw.FactVacunacion AS v\n    INNER JOIN dw.DimEstablecimiento AS e ON e.EstablecimientoKey = v.EstablecimientoKey\n    WHERE v.NumeroDosis = 1\n    GROUP BY e.Provincia\n)\nSELECT m.Provincia, d.PrimerasDosis, m.PoblacionObjetivo,\n       CAST(100.0 * d.PrimerasDosis / m.PoblacionObjetivo AS DECIMAL(5,2)) AS Cobertura,\n       CASE WHEN 100.0 * d.PrimerasDosis / m.PoblacionObjetivo < m.MetaPorcentaje\n            THEN 'Bajo meta' ELSE 'Cumple' END AS Estado\nFROM dw.MetaCobertura AS m\nINNER JOIN Dosis AS d ON d.Provincia = m.Provincia\nORDER BY Cobertura;", "e4_plantilla": "USE BDDataSaludTema06;\nGO\n/* Ejercicio 04 - Plantilla minima. Escribir el codigo debajo de cada requerimiento.\n   R1. dw.CatalogoKPI con al menos 3 KPI: nombre, definicion, formula, fuente, responsable,\n       frecuencia, meta y criterio de calidad.\n   R2. Metadatos tecnicos: descripcion (MS_Description) de las 8 columnas de dw.FactAtencion\n       y una consulta que liste columna, tipo de dato y descripcion.\n   R3. Metricas de calidad: completitud del grupo etario, trazabilidad (EjecucionId),\n       validez de la duracion, consistencia staging-hecho y aceptacion del ultimo lote.\n   R4. Vista publica dw.vw_AtencionPublica por provincia, etapa de vida y tipo, que suprima\n       los grupos con menos de 5 atenciones.\n   R5. (Power BI) Rol \"Analista TRUJILLO\" con seguridad a nivel de fila; comprobar con Ver como. */\n-- R1\n-- (escribir aqui el codigo)\n-- R2\n-- (escribir aqui el codigo)\n-- R3\n-- (escribir aqui el codigo)\n-- R4\n-- (escribir aqui el codigo)", "e4_pruebas": "-- Casos de prueba del Ejercicio 04.\nSELECT COUNT(*) AS KpiCatalogados FROM dw.CatalogoKPI;                         -- >= 3\nSELECT COUNT(*) AS ColumnasDocumentadas\nFROM sys.extended_properties\nWHERE major_id = OBJECT_ID(N'dw.FactAtencion') AND minor_id > 0 AND name = N'MS_Description';  -- 8\nSELECT Estado, COUNT(*) AS Grupos FROM dw.vw_AtencionPublica GROUP BY Estado;  -- 93 publicables | 51 suprimidos", "e5_plantilla": "USE BDDataSaludTema06;\nGO\n/* Ejercicio 05 - Propuesto (tarea). Pagina \"Gobernanza\" del dashboard y transferencia al proyecto.\n   R1. Vista dw.vw_CalidadDatos con las metricas del E04-R3 y su porcentaje (DECIMAL(5,2)).\n   R2. En Power BI: pagina \"Gobernanza\" con la vista R1, el catalogo dw.CatalogoKPI y una\n       medida de semaforo de calidad (>= 95 % verde, >= 90 % ambar, menor rojo).\n   R3. Documentar una operacion OLAP del dashboard (drill-down Provincia -> Establecimiento).\n   R4. Proyecto del equipo: tres KPI con fuente, formula, responsable y criterio de calidad,\n       y dos preguntas de negocio respondidas con datos (informe [1.6]). */\n-- R1\n-- (escribir aqui el codigo)", "e5_dax": "// R2. Medidas de la pagina Gobernanza (tabla vw_CalidadDatos importada).\nCalidad porcentaje = DIVIDE ( SUM ( vw_CalidadDatos[Cumplen] ), SUM ( vw_CalidadDatos[Evaluadas] ) )\n// (escribir aqui la medida)"};

const pc = x => f2(100 * x) + " %";

    if (k === "tipo" || k === "prov" || k === "sem") { const n = nFiltros(s); s.op = n === 0 ? "nofil" : (n === 1 && s.prov !== "TRUJILLO y CHEPEN") ? "slice" : "dice"; }
    s.pg = s.geo; s.pc = s.col;
    const F = { drill: "drill", roll: "roll", slice: "slice", dice: "dice" }[s.op];
    if (F) missionFlag("e1_m", F);
  },
  act(s, a) {
    if (a === "reset") { Object.assign(s, SIMS.olap.init()); return; }
    if (a === "piv") { if (s.col === "(ninguna)") { s.op = "nopiv"; return; } s.piv = !s.piv; s.op = "pivot"; missionFlag("e1_m", "pivot"); }
  },
  out(s) {
    const rows = olapFilter(s), rk = [...new Set(rows.map(r => geoKey(s.geo, r)))].sort(), ck = [...new Set(rows.map(r => colKey(s.col, r)))].sort();
    const cell = new Map(); rows.forEach(r => { const k = geoKey(s.geo, r) + "|" + colKey(s.col, r); const a = cell.get(k) || { c: 0, mi: 0 }; a.c += r.c; a.mi += r.mi; cell.set(k, a); });
    const rt = groupBy(rows, r => geoKey(s.geo, r)), ct = groupBy(rows, r => colKey(s.col, r)), tot = { c: sumC(rows), mi: sumM(rows) };
    const OPS = { drill: "Drill-down: se bajó un nivel de la jerarquía (más detalle).", roll: "Roll-up: se subió un nivel de la jerarquía (menos detalle, totales mayores).", slice: "Slice: se fijó un valor de una dimensión; el resultado es una «rebanada» del cubo.", dice: "Dice: se fijaron varias dimensiones o varios valores; el resultado es un subcubo.", pivot: "Pivot: se intercambiaron filas y columnas; los valores no cambian, cambia la lectura.", col: "Se cambió la dimensión de las columnas.", nofil: "Sin filtros: se ve el cubo completo.", nopiv: "Para hacer pivot, primero se elige una dimensión en Columnas." };
    let h = s.op ? KEYN(`<b>Operación:</b> ${OPS[s.op]}`) : "";
    const single = s.col === "(ninguna)";
    let head, body;
    if (single) { head = [s.geo === "Región" ? "Región" : s.geo, s.med]; body = rk.map(k => [esc(k), medVal(s, rt.get(k))]).concat([["<b>Total</b>", `<b>${medVal(s, tot)}</b>`]]); }
    else if (!s.piv) {
      head = [s.geo + " \\ " + s.col].concat(ck.map(colLab), ["Total"]);
      body = rk.map(k => [esc(k)].concat(ck.map(c => medVal(s, cell.get(k + "|" + c))), [`<b>${medVal(s, rt.get(k))}</b>`])).concat([["<b>Total</b>"].concat(ck.map(c => `<b>${medVal(s, ct.get(c))}</b>`), [`<b>${medVal(s, tot)}</b>`])]);
    } else {
      head = [s.col + " \\ " + s.geo].concat(rk, ["Total"]);
      body = ck.map(c => [esc(colLab(c))].concat(rk.map(k => medVal(s, cell.get(k + "|" + c))), [`<b>${medVal(s, ct.get(c))}</b>`])).concat([["<b>Total</b>"].concat(rk.map(k => `<b>${medVal(s, rt.get(k))}</b>`), [`<b>${medVal(s, tot)}</b>`])]);
    }
    h += TBL(head, body, "num");
    h += `<div class="kv" style="margin-top:8px"><span class="pill">Subcubo: ${fmt(tot.c)} atenciones · ${fmt(tot.mi)} min · promedio ${tot.c ? f2(tot.mi / tot.c) : "—"}</span><span class="pill">Filtros activos: ${nFiltros(s)}</span></div>`;
    const where = [s.tipo !== "(Todos)" ? `t.TipoAtencion = '${s.tipo}'` : "", s.prov === "TRUJILLO y CHEPEN" ? "e.Provincia IN ('TRUJILLO', 'CHEPEN')" : s.prov !== "(Todas)" ? `e.Provincia = '${s.prov}'` : "", s.sem !== "(Ambos)" ? `f.Semestre = ${s.sem}` : ""].filter(Boolean);
    const gb = [s.geo === "Provincia" ? "e.Provincia" : s.geo === "Establecimiento" ? "e.Provincia, e.CodigoEstablecimiento" : "", { "Semestre": "f.Semestre", "Mes": "f.Mes", "Tipo de atención": "t.TipoAtencion", "Etapa de vida": "g.EtapaVida" }[s.col] || ""].filter(Boolean);
    h += `<details class="more"><summary>SQL equivalente (esquema)</summary>${CODE(`SELECT ${gb.length ? gb.join(", ") + ", " : ""}${s.med === "Atenciones" ? "COUNT(*)" : s.med === "Minutos" ? "SUM(h.DuracionMinutos)" : "CAST(1.0 * SUM(h.DuracionMinutos) / COUNT(*) AS DECIMAL(6,2))"}\nFROM dw.FactAtencion AS h  -- + JOIN a las dimensiones\n${where.length ? "WHERE " + where.join("\n  AND ") + "\n" : ""}${gb.length ? "GROUP BY " + gb.join(", ") : ""};`, "sql", "Consulta equivalente · T-SQL")}</details>`;
    if (s.med === "Tiempo promedio") h += KEYN("El total no es el promedio de la fila o la columna: se recalcula con minutos / atenciones del subcubo, igual que el miembro calculado del cubo.");
    return h;
  }
};

/* ---------- 1.2 GROUP BY, ROLLUP, CUBE y GROUPING SETS (teoría 6.1) ---------- */
const GOPS = ["GROUP BY Tipo, Semestre", "ROLLUP (Tipo, Semestre)", "CUBE (Tipo, Semestre)", "GROUPING SETS ((Tipo), (Semestre), ())"];
SIMS.gs = {
  init: () => ({ op: GOPS[0] }),
  ctl: s => `<div class="ctlrow">${sel("gs", "op", "Agrupación", GOPS, s.op)}</div>`,
  out(s) {
    const i = GOPS.indexOf(s.op), sets = [[["t", "s"]], [["t", "s"], ["t"], []], [["t", "s"], ["t"], ["s"], []], [["t"], ["s"], []]][i];
    let out = [];
    sets.forEach(set => {
      const m = groupBy(R, r => (set.includes("t") ? r.t : "") + "|" + (set.includes("s") ? r.sem : ""));
      [...m.keys()].sort().forEach(k => { const [t, se] = k.split("|"), a = m.get(k); out.push([t || NULLC, se || NULLC, set.includes("t") ? 0 : 1, set.includes("s") ? 0 : 1, fmt(a.c), fmt(a.mi)]); });
    });
    return TBL(["Tipo", "Semestre", "GROUPING(Tipo)", "GROUPING(Semestre)", "Atenciones", "Minutos"], out.map(r => r.map((c, j) => (j === 2 || j === 3) && c === 1 ? `<b>1</b>` : c))) +
      `<div class="kv" style="margin-top:8px"><span class="pill">${out.length} filas</span><span class="pill">${sets.length} agrupación(es)</span></div>` +
      KEYN(i === 0 ? "Sin subtotales: una fila por combinación existente." : i === 1 ? "ROLLUP sigue la jerarquía de izquierda a derecha: (Tipo, Semestre), (Tipo) y el total. No genera el subtotal por semestre solo." : i === 2 ? "CUBE genera todas las combinaciones: 2 columnas → 4 agrupaciones. Con más columnas crece rápido (2^n)." : "GROUPING SETS genera solo las agrupaciones listadas: ideal cuando no se necesita el detalle cruzado.") +
      KEYN("Un NULL con GROUPING = 1 significa «todos los valores» (subtotal), no un dato faltante.");
  }
};

/* ---------- 1.3 Dashboard en Power BI: medidas, TREATAS e interacciones (E03) ---------- */
SIMS.kpi = {
  init: () => ({ sem: "(Todos)", tipo: "(Todos)", inter: "Excluida del segmentador (correcto)", tr: "Con TREATAS (correcto)", niv: "Provincia" }),
  ctl: s => `<div class="ctlrow">${sel("kpi", "sem", "Segmentador · semestre", ["(Todos)", "1", "2"], s.sem)}${sel("kpi", "tipo", "Segmentador · tipo", FTIPO.map(x => x === "(Todos)" ? "(Todos)" : x), s.tipo)}</div>
   <div class="ctlrow">${sel("kpi", "inter", "Cobertura frente al segmentador de semestre", ["Excluida del segmentador (correcto)", "Filtrada por el segmentador"], s.inter)}${sel("kpi", "tr", "Medida Poblacion objetivo", ["Con TREATAS (correcto)", "Sin TREATAS: SUM(MetaCobertura[PoblacionObjetivo])"], s.tr)}${sel("kpi", "niv", "Gráfico de cobertura por", ["Provincia", "Establecimiento"], s.niv)}</div>`,
  on(s, k) {
    if (s.tr.startsWith("Sin")) missionFlag("e3_m", "treatas");
    if (s.inter.startsWith("Filtrada") && s.sem !== "(Todos)") missionFlag("e3_m", "inter");
    if (s.niv === "Establecimiento") missionFlag("e3_m", "nivel");
    if (s.sem !== "(Todos)" && s.inter.startsWith("Excluida") && s.tr.startsWith("Con") && s.niv === "Provincia") missionFlag("e3_m", "ok");
  },
  out(s) {
    const at = R.filter(r => (s.sem === "(Todos)" || String(r.sem) === s.sem) && (s.tipo === "(Todos)" || r.t === s.tipo));
    const semCob = s.inter.startsWith("Filtrada") ? s.sem : "(Todos)", vac = RV.filter(r => semCob === "(Todos)" || String(r.sem) === semCob);
    const tr = s.tr.startsWith("Con"), totPob = Object.values(POB).reduce((a, b) => a + b, 0);
    const pobOf = provs => tr ? provs.reduce((a, p) => a + POB[p], 0) : totPob;
    const c = sumC(at), mi = sumM(at), pd = sumC(vac), cob = pd / pobOf(PROVS);
    let h = `<div class="kcards"><div class="kc"><small>Atenciones</small><b>${fmt(c)}</b></div><div class="kc"><small>Tiempo promedio (min)</small><b>${c ? f2(mi / c) : "—"}</b></div><div class="kc ${cob < META ? "bad" : "good"}"><small>Cobertura 1.ª dosis · meta 80 %</small><b>${pc(cob)}</b></div><div class="kc"><small>Atenciones por establecimiento</small><b>${f2(c / 8)}</b></div></div>`;
    let rows;
    if (s.niv === "Provincia") rows = PROVS.map(p => { const n = sumC(vac.filter(v => v.prov === p)), d = pobOf([p]); return [p, n, d, pc(n / d), n / d < META ? '<span class="badge i">Bajo meta</span>' : '<span class="badge v">Cumple</span>']; });
    else rows = ESTS.map(([cod, p]) => { const n = sumC(vac.filter(v => v.cod === cod)), d = pobOf([p]); return [p + " · " + cod, n, d, pc(n / d), n / d < META ? '<span class="badge i">Bajo meta</span>' : '<span class="badge v">Cumple</span>']; });
    h += TBL([s.niv, "Primeras dosis", "Población objetivo", "Cobertura", "Estado"], rows);
    if (!tr) h += ER("Sin TREATAS, MetaCobertura no recibe el filtro de provincia: cada fila divide entre la población de toda la región (482) y ninguna provincia alcanza la meta.");
    if (semCob !== "(Todos)") h += ER("Las dosis se filtraron por semestre, pero la población objetivo es anual: la cobertura cae artificialmente. La tarjeta y el gráfico de cobertura se excluyen del segmentador.");
    if (s.niv === "Establecimiento") h += ER("A nivel de establecimiento, TREATAS asigna a cada uno la población de toda su provincia (por ejemplo, EST-004 se divide entre 190): el indicador no tiene sentido en ese nivel.");
    if (tr && semCob === "(Todos)" && s.niv === "Provincia") h += GOOD(`Lectura correcta: dos provincias bajo la meta (SANCHEZ CARRION y VIRU). ${s.sem !== "(Todos)" || s.tipo !== "(Todos)" ? "Las tarjetas de atenciones sí responden a los segmentadores; la cobertura se mantiene anual." : ""}`);
    if (s.tipo !== "(Todos)") h += KEYN("El segmentador de tipo no afecta la cobertura: FactVacunacion no tiene relación con DimTipoAtencion.");
    return h;
  }
};

/* ---------- 1.4 Supresión de grupos pequeños (E04 · R4) ---------- */
const GRAN = ["Provincia × Etapa", "Provincia × Etapa × Semestre", "Provincia × Etapa × Tipo", "Establecimiento × Etapa × Tipo"];
SIMS.priv = {
  init: () => ({ g: GRAN[2], k: "5", mar: "No" }),
  ctl: s => `<div class="ctlrow">${sel("priv", "g", "Granularidad publicada", GRAN, s.g)}${sel("priv", "k", "Umbral k (suprimir si < k)", ["3", "5", "10"], s.k)}${sel("priv", "mar", "Publicar también el total por ubicación y columna (todas las etapas)", ["No", "Sí"], s.mar)}</div>`,
  on(s) { if (s.g === GRAN[2] && s.k === "5") missionFlag("e4_m", "k5"); if (s.g === GRAN[2] && s.k === "3") missionFlag("e4_m", "k3"); if (s.mar === "Sí" && s.g === GRAN[2] && s.k === "5") missionFlag("e4_m", "dif"); },
  out(s) {
    const k = +s.k, gi = GRAN.indexOf(s.g);
    const rowK = r => (gi === 3 ? r.cod : r.prov) + " · " + r.et, colK = r => gi === 0 ? "" : gi === 1 ? "S" + r.sem : r.t;
    const m = groupBy(R, r => rowK(r) + "|" + colK(r)), keys = [...m.keys()].sort(), sup = keys.filter(x => m.get(x).c < k);
    let h = `<div class="kv"><span class="pill">${keys.length} grupos</span><span class="pill">${sup.length} suprimidos</span><span class="pill">${keys.length - sup.length} publicables</span></div>`;
    const ej = sup.slice(0, 8).map(x => { const [rr, cc] = x.split("|"); return [esc(rr), esc(cc || "—"), NULLC, "SUPRIMIDO (&lt;" + k + ")"]; });
    if (ej.length) h += TBL(["Grupo", "Columna", "Atenciones publicadas", "Estado"], ej) + (sup.length > 8 ? `<p><small>… y ${sup.length - 8} grupos suprimidos más.</small></p>` : "");
    if (s.mar === "Sí" && gi > 0) {
      const byM = new Map(); sup.forEach(x => { const [rr, cc] = x.split("|"), mk = rr.split(" · ")[0] + " · " + cc; const a = byM.get(mk) || []; a.push(x); byM.set(mk, a); });
      const one = [...byM.entries()].filter(([, a]) => a.length === 1), two = [...byM.values()].filter(a => a.length === 2).length;
      h += one.length ? ER(`Con el total por ubicación y columna publicado, ${one.length} celda(s) suprimida(s) se deducen por diferencia (son la única suprimida de su total): ${one.map(([, a]) => a[0].replace("|", " · ") + " = " + m.get(a[0]).c).join("; ")}. Se necesita supresión complementaria o redondeo.`) : GOOD("Ningún total tiene una sola celda suprimida: no se deducen valores individuales.");
      if (two) h += KEYN(`En ${two} totales hay exactamente dos celdas suprimidas: se conoce su suma, aunque no cada valor.`);
    }
    h += KEYN(gi === 0 ? "Con poca granularidad casi no hay grupos pequeños, pero el reporte responde menos preguntas." : gi === 3 ? "Bajar al establecimiento multiplica los grupos pequeños: más detalle, más riesgo de reidentificación." : "La supresión protege, pero tiene un costo: los grupos pequeños suelen ser los de poblaciones vulnerables. Se documenta el umbral en el catálogo.");
    return h;
  }
};

/* ---------- 1.5 Seguridad a nivel de fila (E04 · R5) ---------- */
SIMS.rls = {

    const at = R.filter(r => !eff || r.prov === eff), vac = RV.filter(r => !eff || !onDim || r.prov === eff);
    const provsV = (!eff || !onDim) ? PROVS : [eff], c = sumC(at), mi = sumM(at), cob = sumC(vac) / provsV.reduce((a, x) => a + POB[x], 0);
    let h = `<div class="kcards"><div class="kc"><small>Atenciones</small><b>${fmt(c)}</b></div><div class="kc"><small>Tiempo promedio</small><b>${f2(mi / c)}</b></div><div class="kc"><small>Cobertura 1.ª dosis</small><b>${pc(cob)}</b></div><div class="kc"><small>Provincias visibles en vacunación</small><b>${provsV.length}</b></div></div>`;

    else if (p) h += GOOD(`El filtro viaja de DimEstablecimiento a ambos hechos: ${p} ve solo sus atenciones y su cobertura.`);
    return h;
  }
};

      <button class="btn pri" type="button" data-do="val" data-act="${id}">Comprobar</button>
      <button class="btn" type="button" data-do="hint" data-act="${id}" ${st.hints >= 3 ? "disabled" : ""}>${st.hints >= 3 ? "Sin más pistas" : "Pista " + (st.hints + 1)}</button>
      <button class="btn ghost" type="button" data-do="exp" data-act="${id}" ${st.tries || st.solved ? "" : 'disabled title="Disponible después de comprobar"'}>${st.exp ? "Ocultar explicación" : "Mostrar explicación"}</button>
      ${S.doc && d.sol ? `<button class="btn docb" type="button" data-do="sol" data-act="${id}">${st.sol ? "Ocultar solución docente" : "Solución docente"}</button>` : ""}
      <button class="btn ghost" type="button" data-do="reset" data-act="${id}">Reiniciar actividad</button>
    </div>
    <div id="fb-${id}" role="status" aria-live="polite">${st.solved ? `<div class="fb ok"><span class="ttl">✓ Resuelto${st.first ? " al primer intento" : ""}.</span></div>` : ""}</div>
    <div id="hints-${id}">${d.h.slice(0, st.hints).map(hintHTML).join("")}</div>
    <div id="exp-${id}">${st.exp ? expHTML(d) : ""}</div>
    <div id="sol-${id}">${st.sol && S.doc && d.sol ? solHTML(d) : ""}</div></section>`;
}
function missionItems(id) { const m = A(id).val.m || {}; return ACT[id].missions.map(([k, t]) => `<li><label><input type="checkbox" disabled ${m[k] ? "checked" : ""}> <span>${m[k] ? "✓ " : ""}${esc(t)}</span></label></li>`).join(""); }
function missionFlag(id, k) { if (!k) return; const st = A(id), m = st.val.m || (st.val.m = {}); if (m[k]) return; m[k] = true; save(); const ul = $(`#${id}-mis`); if (ul) ul.innerHTML = missionItems(id); }
function rerenderAct(id) { const el = $("#act-" + id); if (!el) return; const n = el.querySelector("header .n").textContent; el.outerHTML = actHTML(id, el.dataset.as, n); $$(`#act-${id} .simbox`).forEach(renderSim); }

/* ---- validadores: comparan con claves; nunca ejecutan código ---- */
const matchAcc = (n, acc) => acc.some(a => a instanceof RegExp ? a.test(n) : normCode(a) === n);
const V = {
  choice(d, st) { if (st.val.pick == null) return { ok: false, msgs: ["Falta elegir una opción."] }; const o = d.opts[st.val.pick]; return { ok: !!o.ok, msgs: [o.fb || ""], mark: { [st.val.pick]: o.ok ? "ok" : "bad" } }; },
  multi(d, st) {
    const p = st.val.picks || []; if (!p.length) return { ok: false, msgs: ["Falta marcar al menos una opción."] };
    const msgs = [], mark = {};
    p.forEach(i => { mark[i] = d.opts[i].ok ? "ok" : "bad"; if (!d.opts[i].ok) msgs.push(`«${d.opts[i].t}»: ${d.opts[i].fb || "no corresponde."}`); });
    const miss = d.opts.filter((o, i) => o.ok && !p.includes(i)).length;
    if (miss) msgs.push(`Falta${miss > 1 ? "n" : ""} ${miss} opción${miss > 1 ? "es" : ""} correcta${miss > 1 ? "s" : ""}.`);
    return { ok: !msgs.length, msgs, mark };
  },
  match(d, st) {
    const msgs = [], mark = {};
    d.items.forEach((it, i) => { const v = st.val["m" + i]; if (!v) { msgs.push(`Falta relacionar «${it.l}».`); return; } const ok = v === it.a; mark["m" + i] = ok ? "ok" : "bad"; if (!ok) msgs.push(`«${it.l}» no corresponde a «${v}».`); });
    return { ok: !msgs.length, msgs: msgs.slice(0, 6), mark };
  },
  cards(d, st) {
    const msgs = [], mark = {};
    d.cards.forEach((c, i) => { const v = st.val["c" + i]; if (!v) { msgs.push(`Falta clasificar: ${c.rec}.`); return; } const ok = v === c.a; mark["c" + i] = ok ? "ok" : "bad"; if (!ok) msgs.push(`${c.rec}: revisa si el paciente existe y si está activo.`); });
    return { ok: !msgs.length, msgs: msgs.slice(0, 5), mark };
  },
  fill(d, st) {
    const msgs = [], mark = {};
    Object.keys(d.blanks).forEach((k, i) => {
      const b = d.blanks[k], raw = st.val[k] || "", N = b.cs ? normCodeCS : normCode, n = N(raw), lab = `Espacio ${i + 1}`;
      if (!raw.trim()) { msgs.push(`${lab}: está vacío.`); mark[k] = "bad"; return; }
      if (b.acc.some(x => x instanceof RegExp ? x.test(n) : N(x) === n)) { mark[k] = "ok"; return; }
      mark[k] = "bad"; const w = (b.wrong || []).find(([re]) => re.test(n));
      msgs.push(`${lab}: ${w ? w[1] : "no coincide con lo que pide el comentario. Se puede pedir una pista."}`);
    });
    return { ok: !msgs.length, msgs, mark };
  },
  fields(d, st) {
    const msgs = [], mark = {};
    d.fields.forEach(f => {
      const raw = String(st.val[f.k] || ""); if (!raw.trim()) { msgs.push(`«${f.l}»: falta completar.`); mark[f.k] = "bad"; return; }
      let ok;
      if (f.kind === "num") { const x = parseNum(raw); ok = !isNaN(x) && Math.abs(x - f.v) <= (f.tol ?? 0.005); if (!ok) msgs.push(`«${f.l}»: ${isNaN(x) ? "se espera solo un número." : "no coincide con lo esperado."}`); }
      else if (f.kind === "select") { ok = f.ans.includes(raw); if (!ok) msgs.push(`«${f.l}»: no es la opción correcta.`); }
      else { const n = f.code ? normCode(raw) : normTxt(raw); ok = f.acc.some(a => (f.code ? normCode(a) : normTxt(a)) === n); if (!ok) msgs.push(`«${f.l}»: no coincide con lo esperado.`); }
      mark[f.k] = ok ? "ok" : "bad";
    });
    return { ok: !msgs.length, msgs, mark };
  },
  text(d, st) {
    const msgs = [], mark = {};
    d.parts.forEach(p => { const n = normTxt(st.val[p.k] || ""); if (n.length < 20) { msgs.push(`«${p.l.split(".")[0]}»: la respuesta necesita más desarrollo.`); mark[p.k] = "bad"; return; } const miss = p.rub.filter(r => !r.any.some(k => n.includes(k))); mark[p.k] = miss.length ? "bad" : "ok"; miss.forEach(r => msgs.push(`«${p.l.split(".")[0]}»: ${r.miss}`)); });
    return { ok: !msgs.length, msgs, mark };
  },
  mission(d, st) { const m = st.val.m || {}, pend = d.missions.filter(([k]) => !m[k]); return { ok: !pend.length, msgs: pend.map(([, t]) => "Pendiente: " + t) }; }
};
function applyMarks(id, res) {
  const d = ACT[id], root = $("#act-" + id); if (!root) return;
  $$(".opt,select,input.f,input.blank,textarea,.reccard", root).forEach(el => el.classList.remove("ok", "bad"));
  const m = res.mark || {};
  if (d.type === "choice" || d.type === "multi") $$(".opt", root).forEach((el, i) => m[i] && el.classList.add(m[i]));
  else Object.entries(m).forEach(([k, c]) => { const el = $(`[data-k="${k}"]`, root); if (el) el.classList.add(c); if (d.type === "cards") { const i = k.slice(1); $(`#${id}-card${i}`)?.classList.add(c); if (c === "ok") $(`#${id}-why${i}`).innerHTML = `<small>${esc(d.cards[i].why)}</small>`; } });
}
function validate(id) {
  const d = ACT[id], st = A(id), res = V[d.type](d, st);
  if (!st.solved) { st.tries++; if (res.ok) { st.solved = true; st.first = st.tries === 1; } }
  if (d.auto && !st.exp) st.exp = true;
  save(); applyMarks(id, res);
  const fb = $("#fb-" + id);
  fb.innerHTML = res.ok
    ? `<div class="fb ok"><span class="ttl">✓ Correcto${st.first ? " al primer intento" : ""}.</span> ${d.type === "choice" ? esc(res.msgs[0]) : ""}</div>`
    : `<div class="fb bad"><span class="ttl">✕ Revisar (intento ${st.tries}):</span><ul>${res.msgs.filter(Boolean).map(m => `<li>${esc(m)}</li>`).join("")}</ul></div>`;
  const root = $("#act-" + id); root.classList.toggle("solved", st.solved);
  const eb = $(`[data-do="exp"][data-act="${id}"]`, root); eb.disabled = false; eb.removeAttribute("title");
  if (st.exp) { $("#exp-" + id).innerHTML = expHTML(d); eb.textContent = "Ocultar explicación"; }
  renderRail(); updateHeader();
}
function giveHint(id, btn) { const d = ACT[id], st = A(id); if (st.hints >= 3) return; $("#hints-" + id).insertAdjacentHTML("beforeend", hintHTML(d.h[st.hints], st.hints)); st.hints++; save(); btn.textContent = st.hints >= 3 ? "Sin más pistas" : "Pista " + (st.hints + 1); btn.disabled = st.hints >= 3; }
function toggleExp(id, btn) { const st = A(id); st.exp = !st.exp; save(); $("#exp-" + id).innerHTML = st.exp ? expHTML(ACT[id]) : ""; btn.textContent = st.exp ? "Ocultar explicación" : "Mostrar explicación"; }
function toggleSol(id, btn) { if (!ACT[id].sol) return; const st = A(id), open = !$("#sol-" + id).innerHTML; if (open) st.sol = true; save(); $("#sol-" + id).innerHTML = open ? solHTML(ACT[id]) : ""; btn.textContent = open ? "Ocultar solución docente" : "Solución docente"; renderRail(); }
function resetAct(id) { delete S.a[id]; if (ACT[id].type === "mission" && ACT[id].sim) delete S.sim[ACT[id].sim]; save(); rerenderAct(id); renderRail(); updateHeader(); toast("Actividad reiniciada"); }

/* ---- eventos ---- */
document.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.go) { go(b.dataset.go); return; }
  const id = b.dataset.act;
  if (b.dataset.do) {
    const d = b.dataset.do;
    if (d === "val") validate(id); else if (d === "hint") giveHint(id, b); else if (d === "exp") toggleExp(id, b);
    else if (d === "sol") toggleSol(id, b); else if (d === "reset") resetAct(id);
    else if (d === "resetall") $("#resetZone").innerHTML = `¿Borrar todo el avance? <button type="button" class="linkbtn" data-do="resetyes">Sí, borrar</button> · <button type="button" class="linkbtn" style="color:var(--ink)" data-do="resetno">No</button>`;
    else if (d === "resetyes") { const pj = S.proj, dc = S.doc; S = FRESH(); S.proj = pj; S.doc = dc; save(); go(SCREENS[0].id); toast("Avance reiniciado"); }
    else if (d === "resetno") renderRail();
    return;
  }
  if (b.dataset.opt != null) {
    const d = ACT[id], st = A(id), i = +b.dataset.opt;
    if (d.type === "choice") { st.val.pick = i; $$(`[data-act="${id}"][data-opt]`).forEach(o => { o.setAttribute("aria-pressed", o === b); o.classList.remove("ok", "bad"); }); }
    else { const p = st.val.picks || (st.val.picks = []), k = p.indexOf(i); k >= 0 ? p.splice(k, 1) : p.push(i); b.setAttribute("aria-pressed", k < 0); $$(`[data-act="${id}"][data-opt]`).forEach(o => o.classList.remove("ok", "bad")); }
    save(); return;
  }
  if (b.dataset.sa) {
    const [n, a] = b.dataset.sa.split(":"); SIMS[n].act(SS(n), a); save(); fullSim(n);
    $(`[data-sa="${b.dataset.sa}"]`)?.focus(); return;
  }
  if (b.dataset.copy != null) {
    const txt = COPYBUF[+b.dataset.copy];
    const fallback = () => { const pre = b.closest(".cw").querySelector("pre"); const rg = document.createRange(); rg.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(rg); toast("Código seleccionado: Ctrl+C para copiar"); };
    try { navigator.clipboard.writeText(txt).then(() => { b.textContent = "Copiado ✓"; setTimeout(() => b.textContent = "Copiar", 1500); }, fallback); } catch (e) { fallback(); }
    return;
  }
});
function onInput(ev) {
  const el = ev.target;
  if (el.dataset.act && el.dataset.k) { A(el.dataset.act).val[el.dataset.k] = el.value; el.classList.remove("ok", "bad"); if (el.classList.contains("blank")) el.size = Math.max(+el.getAttribute("size") || 4, el.value.length + 1); save(); return; }
  if (el.dataset.si) {
    const [n, k] = el.dataset.si.split(":"), s = SS(n);
    s[k] = el.type === "checkbox" ? el.checked : el.value;
    if (SIMS[n].on) { SIMS[n].on(s, k); save(); fullSim(n); $(`[data-si="${el.dataset.si}"]`)?.focus(); return; }
    save(); $$(`.simbox[data-sim="${n}"]`).forEach(b => b.contains(el) ? ($(".so", b).innerHTML = SIMS[n].out(s)) : renderSim(b)); return;
  }
  if (el.dataset.ev) { S.ev[el.dataset.ev] = el.checked; save(); return; }
}
document.addEventListener("input", ev => { if (ev.target.tagName !== "SELECT" && ev.target.type !== "checkbox") onInput(ev); });
document.addEventListener("change", ev => { if (ev.target.tagName === "SELECT" || ev.target.type === "checkbox") onInput(ev); });
document.addEventListener("keydown", ev => { if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey) && ev.target.matches("textarea.mg-ta")) { ev.preventDefault(); const n = ev.target.dataset.si.split(":")[0]; SIMS[n].act(SS(n), "run"); save(); fullSim(n); $(`[data-si="${n}:code"]`)?.focus(); return; } if (ev.key === "Enter" && ev.target.matches("input.blank, input.f[data-act]")) { ev.preventDefault(); validate(ev.target.dataset.act); } });

function applyPrefs() {
  document.documentElement.classList.toggle("proj", !!S.proj);
  $("#projBtn").setAttribute("aria-pressed", !!S.proj);
  const db = $("#docBtn"); if (db) { db.setAttribute("aria-pressed", !!S.doc); db.textContent = S.doc ? "Ocultar solución docente" : "Mostrar solución docente"; }
}
$("#projBtn").addEventListener("click", () => { S.proj = !S.proj; save(); applyPrefs(); });
const DB = $("#docBtn");
if (DB) DB.addEventListener("click", () => { S.doc = !S.doc; save(); applyPrefs(); if (!S.doc && modDef(SCREENS[SCR_IDX[S.scr]].mod).docOnly) go(SCREENS[0].id); else renderAll(); toast(S.doc ? "Modo docente: soluciones, guion y código resuelto visibles" : "Modo docente desactivado"); });
$("#menuBtn").addEventListener("click", () => { const o = $("#rail").classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded", o); });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h in SCR_IDX && h !== S.scr) go(h); });
applyPrefs();
const hash0 = (location.hash || "").slice(1);
go(hash0 in SCR_IDX ? hash0 : (S.scr in SCR_IDX ? S.scr : SCREENS[0].id), false);

</script>
